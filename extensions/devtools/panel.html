<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActView DevTools</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">ActView <span>DevTools</span></div>
      <div class="status" id="status">connecting…</div>
      <div class="topbar-actions">
        <select id="app-select" title="Application"></select>
        <button id="refresh" class="btn">Refresh</button>
        <button id="pick" class="btn">Pick element</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">
          Components
          <button id="clear-highlight" class="link">clear highlight</button>
        </div>
        <div id="tree" class="tree"></div>
      </aside>

      <main class="main">
        <nav class="tabs">
          <button data-tab="components" class="tab active">Components</button>
          <button data-tab="events" class="tab">Events</button>
          <button data-tab="performance" class="tab">Performance</button>
          <button id="pause" class="tab right">Pause events</button>
        </nav>

        <section id="tab-components" class="tab-panel">
          <div id="details" class="details empty">
            Select a component from the tree.
          </div>
        </section>

        <section id="tab-events" class="tab-panel hidden">
          <div class="panel-hint">Recent mount / update / track / trigger events.</div>
          <div id="events" class="table-wrap"></div>
        </section>

        <section id="tab-performance" class="tab-panel hidden">
          <div class="panel-hint">Render duration (mount / update).</div>
          <div id="performance" class="table-wrap"></div>
        </section>
      </main>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
