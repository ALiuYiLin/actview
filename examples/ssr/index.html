<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActView SSR Demo</title>
    <style>
      body {
        font-family: system-ui, 'Segoe UI', sans-serif;
        background: #f6f7f9;
        margin: 0;
        color: #1f2937;
      }
      .app {
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }
      .title {
        font-size: 26px;
        margin: 0 0 6px;
      }
      .sub {
        color: #6b7280;
        margin: 0 0 28px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      .card h2 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      .hint {
        color: #9ca3af;
        font-size: 12px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .inc {
        background: #2563eb;
        color: #fff;
      }
      .reset {
        background: #e5e7eb;
        color: #374151;
      }
      .val {
        font-size: 22px;
        font-weight: 600;
        min-width: 24px;
        text-align: center;
      }
      .posts {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .post {
        padding: 10px 0;
        border-top: 1px solid #f3f4f6;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .post:first-child {
        border-top: none;
      }
      .post span {
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
